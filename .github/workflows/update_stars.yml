name: Update Stars List

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install starred
        run: pip install starred

      - name: Generate README
        run: |
          starred --username ${{ github.repository_owner }} --repository "${GITHUB_REPOSITORY#*/}" --sort --token ${{ secrets.MY_GITHUB_TOKEN }} > README.md

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update stars list" && git push)
