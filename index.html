<!DOCTYPE html>
<html lang="cn">
<head>
  <meta charset="UTF-8">
  <title>My GitHub Stars</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
</head>
<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: '我的星标库',
      repo: 'https://github.com{{ github.repository_owner }}/${{ github.event.repository.name }}',
      loadSidebar: false, // 设为 false，直接使用 README.md
      auto2top: true,
      search: 'auto' // 启用搜索功能
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
